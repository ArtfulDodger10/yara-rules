name: tests

on:
  push:
  pull_request:

jobs:
  rules:
    # windows runner so the rule logic tests can build test assemblies with csc.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile tools/yara_scan.py
